<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-labelledby="t d" lang="ja">
<title id="t">ringi-server の全体</title><desc id="d">申請の種類と組織を書くと、ritsu がコードを生成します。ringi-server はそのコードを、人とプログラムとエージェントのために動かし、すべてを PostgreSQL に残します。</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #334155; }
.h { font-weight: 700; font-size: 15px; fill: #0f172a; }
.s { font-weight: 700; font-size: 13px; fill: #0f172a; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1d4ed8; }
.ground { fill: #f8fafc; }
.box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
.main { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; }
.arrow { stroke: #64748b; stroke-width: 1.6; fill: none; }
.head { fill: #64748b; }
@media (prefers-color-scheme: dark) {
text { fill: #cbd5e1; } .h, .s { fill: #f1f5f9; } .k { fill: #93c5fd; }
.ground { fill: #0f172a; } .box { fill: #1e293b; stroke: #475569; } .main { fill: #172554; stroke: #93c5fd; }
.arrow { stroke: #94a3b8; } .head { fill: #94a3b8; }
}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L8 4L0 8Z"/></marker></defs>
<rect class="ground" width="900" height="432" rx="14"/>
<rect class="box" x="24" y="24" width="262" height="112" rx="10"/>
<text class="h" x="40" y="51" text-anchor="start">自分で書く物</text>
<text class="t" x="40" y="76" text-anchor="start">申請の種類（.ringi）、権限（.gate）、</text>
<text class="t" x="40" y="96" text-anchor="start">営業日（.cal）、flow と帳簿、</text>
<text class="t" x="40" y="116" text-anchor="start">組織のデータ（CSV）</text>
<path class="arrow" d="M286 80L366 80" marker-end="url(#head)"/>
<text class="k" x="326" y="70" text-anchor="middle">ritsu gen</text>
<rect class="box" x="368" y="24" width="258" height="112" rx="10"/>
<text class="h" x="384" y="51" text-anchor="start">ritsu が生成する物</text>
<text class="t" x="384" y="76" text-anchor="start">申請がどうなるかを決める Go のコード</text>
<text class="t" x="384" y="96" text-anchor="start">約束（OpenAPI、画面、</text>
<text class="t" x="384" y="116" text-anchor="start">試験用のベクタ）</text>
<rect class="box" x="658" y="24" width="218" height="112" rx="10"/>
<text class="h" x="674" y="51" text-anchor="start">自分のコマンド</text>
<text class="t" x="674" y="76" text-anchor="start">生成したパッケージと権限、</text>
<text class="t" x="674" y="96" text-anchor="start">自分で用意する通知・帳簿・flow</text>
<text class="t" x="674" y="116" text-anchor="start">をサーバーに渡す</text>
<path class="arrow" d="M497 136L497 196" marker-end="url(#head)"/>
<path class="arrow" d="M767 136L767 166L590 166L590 196" marker-end="url(#head)"/>
<rect class="box" x="24" y="204" width="190" height="54" rx="10"/>
<text class="s" x="40" y="227" text-anchor="start">人</text>
<text class="t" x="40" y="246" text-anchor="start">ブラウザのページ</text>
<path class="arrow" d="M214 231L290 231" marker-end="url(#head)"/>
<rect class="box" x="24" y="272" width="190" height="54" rx="10"/>
<text class="s" x="40" y="295" text-anchor="start">プログラム</text>
<text class="t" x="40" y="314" text-anchor="start">HTTP の API</text>
<path class="arrow" d="M214 299L290 299" marker-end="url(#head)"/>
<rect class="box" x="24" y="340" width="190" height="54" rx="10"/>
<text class="s" x="40" y="363" text-anchor="start">エージェント</text>
<text class="t" x="40" y="382" text-anchor="start">MCP のツール</text>
<path class="arrow" d="M214 367L290 367" marker-end="url(#head)"/>
<rect class="main" x="292" y="198" width="336" height="206" rx="10"/>
<text class="h" x="308" y="225" text-anchor="start">ringi-server</text>
<text class="t" x="308" y="250" text-anchor="start">ログインと、リクエストごとの確かめ</text>
<text class="t" x="308" y="282" text-anchor="start">権限を確かめ、生成したコードを動かす</text>
<text class="t" x="308" y="314" text-anchor="start">申請と履歴をすべて残す</text>
<text class="t" x="308" y="346" text-anchor="start">期限と催促を時刻どおりに動かす</text>
<text class="t" x="308" y="378" text-anchor="start">通知などは、済むまでやり直す</text>
<rect class="box" x="684" y="198" width="192" height="34" rx="10"/>
<text class="t" x="697" y="220" text-anchor="start">PostgreSQL</text>
<path class="arrow" d="M628 215L682 215" marker-end="url(#head)"/>
<rect class="box" x="684" y="240" width="192" height="34" rx="10"/>
<text class="t" x="697" y="262" text-anchor="start">OpenID Connect（ログイン）</text>
<path class="arrow" d="M628 257L682 257" marker-end="url(#head)"/>
<rect class="box" x="684" y="282" width="192" height="34" rx="10"/>
<text class="t" x="697" y="304" text-anchor="start">通知：メール、チャット</text>
<path class="arrow" d="M628 299L682 299" marker-end="url(#head)"/>
<rect class="box" x="684" y="324" width="192" height="34" rx="10"/>
<text class="t" x="697" y="346" text-anchor="start">帳簿：予算、休暇</text>
<path class="arrow" d="M628 341L682 341" marker-end="url(#head)"/>
<rect class="box" x="684" y="366" width="192" height="34" rx="10"/>
