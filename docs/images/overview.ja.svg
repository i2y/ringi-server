<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-labelledby="t d" lang="ja">
<title id="t">ringi-server の全体</title><desc id="d">申請の種類、組織のデータ、権限をファイルに書く。ritsu がそれを検査して Go のコードを作る。ringi-server を使ったサーバーがそのコードを動かし、人とプログラムとエージェントが使う。申請はすべて PostgreSQL に残る。</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #334155; }
.h { font-weight: 700; font-size: 15px; fill: #0f172a; }
.s { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
.n { font-weight: 700; font-size: 14px; fill: #ffffff; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1d4ed8; }
.l { font-size: 12.5px; fill: #475569; }
.ground { fill: #f8fafc; }
.box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
.main { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; }
.good { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.4; }
.end { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
.dot { fill: #1d4ed8; }
.arrow { stroke: #64748b; stroke-width: 1.6; fill: none; }
.back { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.head { fill: #64748b; }
@media (prefers-color-scheme: dark) {
text { fill: #cbd5e1; } .h, .s { fill: #f1f5f9; } .n { fill: #0f172a; } .k { fill: #93c5fd; } .l { fill: #cbd5e1; }
.ground { fill: #0f172a; } .box { fill: #1e293b; stroke: #475569; } .main { fill: #172554; stroke: #93c5fd; }
.good { fill: #052e16; stroke: #4ade80; } .end { fill: #1e293b; stroke: #64748b; } .dot { fill: #93c5fd; }
.arrow, .back { stroke: #94a3b8; } .head { fill: #94a3b8; }
}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L8 4L0 8Z"/></marker></defs>
<rect class="ground" width="900" height="432" rx="14"/>
<rect class="box" x="24" y="24" width="236" height="112" rx="10"/>
<text class="h" x="40" y="51" text-anchor="start">1. 書く</text>
<text class="t" x="40" y="76" text-anchor="start">申請の種類（.ringi）</text>
<text class="t" x="40" y="96" text-anchor="start">組織のデータ（CSV）</text>
<text class="t" x="40" y="116" text-anchor="start">権限（.gate）、休日（.cal）</text>
<path class="arrow" d="M260 80L366 80" marker-end="url(#head)"/>
<text class="l" x="313" y="70" text-anchor="middle">検査して生成</text>
<rect class="box" x="368" y="24" width="212" height="112" rx="10"/>
<text class="h" x="384" y="51" text-anchor="start">2. ritsu が作る</text>
<text class="t" x="384" y="76" text-anchor="start">申請をどう進めるかを決める</text>
<text class="t" x="384" y="96" text-anchor="start">Go のコード</text>
<text class="t" x="384" y="116" text-anchor="start">API と画面の定義</text>
<rect class="box" x="608" y="24" width="268" height="112" rx="10"/>
<text class="h" x="624" y="51" text-anchor="start">3. サーバーを動かす</text>
<text class="t" x="624" y="76" text-anchor="start">ringi-server を使う Go のプログラム。</text>
<text class="t" x="624" y="96" text-anchor="start">メールやログインなど、つなぐものは</text>
<text class="t" x="624" y="116" text-anchor="start">自分で渡す</text>
<path class="arrow" d="M580 80L606 80" marker-end="url(#head)"/>
<path class="arrow" d="M742 136L742 166L460 166L460 196" marker-end="url(#head)"/>
<rect class="box" x="24" y="204" width="190" height="54" rx="10"/>
<text class="s" x="40" y="227" text-anchor="start">人</text>
<text class="t" x="40" y="246" text-anchor="start">ブラウザのページ</text>
<path class="arrow" d="M214 231L290 231" marker-end="url(#head)"/>
<rect class="box" x="24" y="272" width="190" height="54" rx="10"/>
<text class="s" x="40" y="295" text-anchor="start">プログラム</text>
<text class="t" x="40" y="314" text-anchor="start">HTTP の API</text>
<path class="arrow" d="M214 299L290 299" marker-end="url(#head)"/>
<rect class="box" x="24" y="340" width="190" height="54" rx="10"/>
<text class="s" x="40" y="363" text-anchor="start">エージェント</text>
<text class="t" x="40" y="382" text-anchor="start">ツール（MCP）</text>
<path class="arrow" d="M214 367L290 367" marker-end="url(#head)"/>
<rect class="main" x="292" y="198" width="336" height="206" rx="10"/>
<text class="h" x="308" y="225" text-anchor="start">サーバー（ringi-server）</text>
<text class="t" x="308" y="250" text-anchor="start">だれの操作かを確かめる</text>
<text class="t" x="308" y="282" text-anchor="start">その操作をしてよいかを確かめる</text>
<text class="t" x="308" y="314" text-anchor="start">作られたコードのとおりに申請を進める</text>
<text class="t" x="308" y="346" text-anchor="start">申請と履歴を保存する</text>
<text class="t" x="308" y="378" text-anchor="start">期限を見張り、通知を送る</text>
<rect class="box" x="660" y="198" width="216" height="34" rx="10"/>
<text class="t" x="672" y="220" text-anchor="start">PostgreSQL</text>
<path class="arrow" d="M628 215L658 215" marker-end="url(#head)"/>
<rect class="box" x="660" y="240" width="216" height="34" rx="10"/>
<text class="t" x="672" y="262" text-anchor="start">ログインのプロバイダー</text>
<path class="arrow" d="M628 257L658 257" marker-end="url(#head)"/>
<rect class="box" x="660" y="282" width="216" height="34" rx="10"/>
<text class="t" x="672" y="304" text-anchor="start">通知：メール、チャット</text>
<path class="arrow" d="M628 299L658 299" marker-end="url(#head)"/>
<rect class="box" x="660" y="324" width="216" height="34" rx="10"/>
<text class="t" x="672" y="346" text-anchor="start">帳簿：予算、休暇の残り</text>
<path class="arrow" d="M628 341L658 341" marker-end="url(#head)"/>
<rect class="box" x="660" y="366" width="216" height="34" rx="10"/>
<text class="t" x="672" y="388" text-anchor="start">承認のあとの処理：Temporal</text>
<path class="arrow" d="M628 383L658 383" marker-end="url(#head)"/>
</svg>
