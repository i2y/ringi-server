<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d" lang="ja">
<title id="t">社員に使ってもらうサーバー</title><desc id="d">社員のブラウザは、https を受けるプロキシに届き、プロキシはサーバーのプロセスの一つにリクエストを渡す。プロセスは一つの PostgreSQL のデータベースを共有し、会社のプロバイダーでログインさせ、通知などはつないだ先へ送る。</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #334155; }
.h { font-weight: 700; font-size: 15px; fill: #0f172a; }
.s { font-weight: 700; font-size: 13.5px; fill: #0f172a; }
.n { font-weight: 700; font-size: 14px; fill: #ffffff; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1d4ed8; }
.l { font-size: 12.5px; fill: #475569; }
.ground { fill: #f8fafc; }
.box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
.main { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; }
.good { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.4; }
.end { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
.dot { fill: #1d4ed8; }
.arrow { stroke: #64748b; stroke-width: 1.6; fill: none; }
.back { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
.head { fill: #64748b; }
@media (prefers-color-scheme: dark) {
text { fill: #cbd5e1; } .h, .s { fill: #f1f5f9; } .n { fill: #0f172a; } .k { fill: #93c5fd; } .l { fill: #cbd5e1; }
.ground { fill: #0f172a; } .box { fill: #1e293b; stroke: #475569; } .main { fill: #172554; stroke: #93c5fd; }
.good { fill: #052e16; stroke: #4ade80; } .end { fill: #1e293b; stroke: #64748b; } .dot { fill: #93c5fd; }
.arrow, .back { stroke: #94a3b8; } .head { fill: #94a3b8; }
}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L8 4L0 8Z"/></marker></defs>
<rect class="ground" width="900" height="300" rx="14"/>
<rect class="box" x="24" y="88" width="140" height="64" rx="10"/>
<text class="s" x="94.0" y="116.0" text-anchor="middle">社員のブラウザ</text>
<text class="l" x="94.0" y="136.0" text-anchor="middle">https</text>
<path class="arrow" d="M164 120L206 120" marker-end="url(#head)"/>
<rect class="box" x="208" y="88" width="130" height="64" rx="10"/>
<text class="s" x="273.0" y="116.0" text-anchor="middle">プロキシ</text>
<text class="l" x="273.0" y="136.0" text-anchor="middle">https を受ける</text>
<path class="arrow" d="M338 120L380 120" marker-end="url(#head)"/>
<rect class="main" x="394" y="66" width="220" height="92" rx="10"/>
<rect class="main" x="382" y="78" width="220" height="92" rx="10"/>
<text class="h" x="492" y="118" text-anchor="middle">サーバー</text>
<text class="l" x="492" y="140" text-anchor="middle">プロセスは一つでも複数でもよい</text>
<path class="arrow" d="M492 170L492 208" marker-end="url(#head)"/>
<rect class="box" x="372" y="210" width="240" height="72" rx="10"/>
<text class="s" x="492" y="234" text-anchor="middle">PostgreSQL</text>
<text class="l" x="492" y="253" text-anchor="middle">申請、履歴、添付ファイル、</text>
<text class="l" x="492" y="270" text-anchor="middle">タイマー、記録</text>
<rect class="box" x="668" y="24" width="208" height="58" rx="10"/>
<text class="s" x="772.0" y="49.0" text-anchor="middle">ログインのプロバイダー</text>
<text class="l" x="772.0" y="69.0" text-anchor="middle">OpenID Connect</text>
<path class="arrow" d="M614 112L640 112L640 53L666 53" marker-end="url(#head)"/>
<rect class="box" x="668" y="96" width="208" height="58" rx="10"/>
<text class="s" x="772.0" y="121.0" text-anchor="middle">メール、チャット</text>
<text class="l" x="772.0" y="141.0" text-anchor="middle">プロジェクトの Notifier</text>
<path class="arrow" d="M614 112L640 112L640 125L666 125" marker-end="url(#head)"/>
<rect class="box" x="668" y="168" width="208" height="58" rx="10"/>
<text class="s" x="772.0" y="193.0" text-anchor="middle">Temporal など</text>
<text class="l" x="772.0" y="213.0" text-anchor="middle">使うときだけ</text>
<path class="arrow" d="M614 112L640 112L640 197L666 197" marker-end="url(#head)"/>
</svg>
